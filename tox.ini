[tox]
min_version = 4.0
skip_missing_interpreters = true
env_list =
    lint
    py{312,313,314}
    py{312,313,314}-all
    coverage-report

[testenv]
extras =
    all: all
deps =
    pytest>=8.0
    pytest-asyncio>=0.24
    coverage[toml]>=7.0
commands =
    coverage run -m pytest {posargs}

[testenv:integration]
extras = all
deps =
    pytest>=8.0
    pytest-asyncio>=0.24
commands =
    pytest -m integration -v {posargs}

[testenv:coverage-report]
skip_install = true
depends = py{312,313,314}{,-all}
parallel_show_output = true
deps =
    coverage[toml]>=7.0
commands =
    coverage combine
    coverage report
    coverage html

[testenv:lint]
skip_install = true
deps = ruff>=0.11
commands =
    ruff check {posargs:src tests}
    ruff format --check {posargs:src tests}

[testenv:fix]
skip_install = true
deps = ruff>=0.11
commands =
    ruff check --fix {posargs:src tests}
    ruff format {posargs:src tests}

[gh]
python =
    3.12 = py312, py312-all
    3.13 = py313, py313-all
    3.14 = py314, py314-all
