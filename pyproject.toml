[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "retread"
description = "Compare downstream rebuilds of upstream wheels to detect differences and bugs"
dynamic = ["version"]
license = "Apache-2.0"
authors = [{ name = "Christian Heimes", email = "christian@python.org" }]
requires-python = ">=3.12"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "zipwire[requests]>=0.2",
    "pypi-simple>=1.6",
    "packaging>=24",
]

[project.urls]
Homepage = "https://github.com/tiran/retread"
Source = "https://github.com/tiran/retread"
Issues = "https://github.com/tiran/retread/issues"

[project.scripts]
retread = "retread.__main__:main"

[project.optional-dependencies]
httpx2 = ["zipwire[httpx2]", "httpx2[http2]>=2"]
aiohttp = ["zipwire[aiohttp]", "aiohttp>=3.9"]
all = [
    "zipwire[all]",
    "httpx2[http2]>=2",
    "aiohttp>=3.9",
]

[dependency-groups]
dev = [
    "retread[all]",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "coverage[toml]>=7",
    "ruff>=0.11",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/retread/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/retread"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: tests that hit real network services (deselect with '-m not integration')"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "TCH", "RUF"]

[tool.coverage.run]
branch = true
parallel = true
source = ["retread"]
omit = ["*/_version.py"]

[tool.coverage.paths]
source = [
    "src/retread",
    ".tox/*/lib/python*/site-packages/retread",
]

[tool.coverage.report]
show_missing = true
